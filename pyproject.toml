
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Multi-tenant Enterprise RAG with hybrid retrieval, reranking, ACL filtering, and AWS Bedrock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Sagar Khangan" }
]

keywords = [
    "rag",
    "retrieval-augmented-generation",
    "aws-bedrock",
    "hybrid-search",
    "reranking",
    "multi-tenant",
    "llm",
]

dependencies = [
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pypdf>=4,<7",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
]


[project.scripts]
enterprise-rag = "ask:main"


[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ask"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_rag*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]


[tool.coverage.run]
source = ["enterprise_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
